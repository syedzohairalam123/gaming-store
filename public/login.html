<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Login — Gaming Store</title>
  <link rel="stylesheet" href="style.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg gs-nav">
    <div class="container-fluid px-3">
      <a class="navbar-brand gs-brand" href="index.html">Gaming<span class="brand-red">Store</span></a>
      <div class="d-flex gap-2">
        <a href="login.html" class="nav-login-link active">Login</a>
        <a href="signup.html" class="nav-login-link">Sign Up</a>
      </div>
    </div>
  </nav>

  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-icon">🎮</div>
        <h2>Welcome Back!</h2>
        <p>Login to your Gaming Store account</p>
      </div>
      <form id="loginForm">
        <div class="auth-field">
          <label>Email Address</label>
          <input type="email" id="loginEmail" placeholder="your@email.com" required/>
        </div>
        <div class="auth-field">
          <label>Password</label>
          <input type="password" id="loginPassword" placeholder="••••••••" required/>
        </div>
        <button type="submit" class="auth-btn">Login to Account</button>
        <div class="auth-msg" id="loginMsg"></div>
      </form>
      <div class="auth-footer">
        Don't have an account? <a href="signup.html">Sign Up</a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="auth.js"></script>
</body>
</html>
