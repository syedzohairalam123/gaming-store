<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Sign Up — Gaming Store</title>
  <link rel="stylesheet" href="style.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg gs-nav">
    <div class="container-fluid px-3">
      <a class="navbar-brand gs-brand" href="index.html">Gaming<span class="brand-red">Store</span></a>
      <div class="d-flex gap-2">
        <a href="login.html" class="nav-login-link">Login</a>
        <a href="signup.html" class="nav-login-link active">Sign Up</a>
      </div>
    </div>
  </nav>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-icon">🎮</div>
        <h2>Create Account</h2>
        <p>Join Gaming Store today</p>
      </div>
      <form id="signupForm">
        <div class="auth-field">
          <label>Full Name</label>
          <input type="text" id="signupName" placeholder="Ali Khan" required/>
        </div>
        <div class="auth-field">
          <label>Email Address</label>
          <input type="email" id="signupEmail" placeholder="your@email.com" required/>
        </div>
        <div class="auth-field">
          <label>Phone Number</label>
          <input type="tel" id="signupPhone" placeholder="03001234567"/>
        </div>
        <div class="auth-field">
          <label>Password</label>
          <input type="password" id="signupPassword" placeholder="Min 6 characters" required/>
        </div>
        <div class="auth-field">
          <label>Confirm Password</label>
          <input type="password" id="signupConfirm" placeholder="Repeat password" required/>
        </div>
        <button type="submit" class="auth-btn">Create Account</button>
        <div class="auth-msg" id="signupMsg"></div>
      </form>
      <div class="auth-footer">
        Already have an account? <a href="login.html">Login</a>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="auth.js"></script>
</body>
</html>
